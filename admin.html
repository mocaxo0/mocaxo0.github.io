

<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="robots" content="noindex,nofollow">

<title>moca 管理画面</title>

<style>

*{box-sizing:border-box}

body{margin:0;background:#fff7fb;color:#804563;font-family:-apple-system,sans-serif}

main{max-width:560px;margin:auto;padding:24px 16px 90px}

h1{text-align:center;color:#e65d9d;font-size:34px}

h2{font-size:18px}

.card{background:white;border:1px solid #f1c9dc;border-radius:22px;padding:20px;margin:18px 0}

label{display:block;font-weight:bold;margin-top:18px;margin-bottom:7px}

input,textarea{width:100%;font:inherit;padding:13px;border:1px solid #e9bcd3;border-radius:12px}

textarea{min-height:160px}

button{width:100%;margin-top:16px;padding:14px;background:#e65d9d;color:white;border:0;border-radius:13px;font-weight:bold;font-size:16px}

button:disabled{opacity:.5}

.hidden{display:none}

#preview{width:100%;max-height:360px;object-fit:contain;margin-top:12px;border-radius:12px}

#status{white-space:pre-wrap}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.stat{background:#fff0f7;border-radius:15px;text-align:center;padding:14px}

.stat b{display:block;color:#dd5092;font-size:26px}

.stat small{font-size:12px}

a{color:#cc4e8b}

</style>

<script src="config.js"></script>

</head>

<body>

<main>

<h1>moca ♡</h1>

<p style="text-align:center">🎀 ホームページ管理画面 🎀</p>

<p id="status"></p>

<section id="login" class="card">

<h2>🔒 ログイン</h2>

<label>メールアドレス</label>

<input id="email" type="email">

<label>パスワード</label>

<input id="password" type="password">

<button id="signin">ログイン</button>

</section>

<div id="panel" class="hidden">

<section class="card">

<h2>💗 ホームページ編集</h2>

<label>自己紹介</label>

<textarea id="bio"></textarea>

<label>シフト画像</label>

<input id="image" type="file" accept="image/png,image/jpeg,image/webp">

<img id="preview" alt="シフト画像">

<button id="upload">画像をアップロード</button>

<label>🛁 お店のURL</label>

<input id="shop" type="url">

<label>🎁 欲しリスのURL</label>

<input id="wish" type="url">

<label>XのURL</label>

<input id="xlink" type="url">

<button id="save">変更を保存 ♡</button>

<p id="result"></p>

</section>

<section class="card">

<h2>📊 アクセス状況</h2>

<div class="stats">

<div class="stat"><b id="visits">—</b><small>ページ表示</small></div>

<div class="stat"><b id="unique">—</b><small>推定訪問者</small></div>

<div class="stat"><b id="shopCount">—</b><small>🛁 タップ</small></div>

<div class="stat"><b id="wishCount">—</b><small>🎁 タップ</small></div>

<div class="stat"><b id="xCount">—</b><small>X タップ</small></div>

</div>

<p style="font-size:12px">直近5000件の集計です。</p>

<button id="refresh">更新</button>

</section>

<button id="logout">ログアウト</button>

</div>

<p style="text-align:center">

<a href="./">ホームページを見る</a>

</p>

</main>

<script type="module">

const $ = id => document.getElementById(id);

const cfg = window.MOCA_CONFIG;

if (!cfg?.publishableKey) {

  $('status').textContent = 'config.js の設定を確認してください';

} else {

  const {createClient} = await import(

    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/+esm'

  );

  const db = createClient(cfg.url,cfg.publishableKey);

  let imageUrl = '';

  async function load() {

    const {data,error} = await db.from('moca_site')

      .select('*').eq('id',1).single();

    if(error) {

      $('status').textContent = error.message;

      return;

    }

    $('bio').value = data.bio || '';

    $('shop').value = data.shop_url || '';

    $('wish').value = data.wish_url || '';

    $('xlink').value = data.x_url || '';

    imageUrl = data.schedule_url || '';

    $('preview').src = imageUrl;

  }

  async function stats() {

    const {data,error} = await db.from('moca_events')

      .select('event_type,visitor_id')

      .order('id',{ascending:false}).limit(5000);

    if(error) {

      $('status').textContent = error.message;

      return;

    }

    const count = t => data.filter(v=>v.event_type===t).length;

    $('visits').textContent = count('visit');

    $('unique').textContent = new Set(

      data.filter(v=>v.event_type==='visit').map(v=>v.visitor_id)

    ).size;

    $('shopCount').textContent = count('shop');

    $('wishCount').textContent = count('wish');

    $('xCount').textContent = count('x');

  }

  async function show() {

    const {data} = await db.auth.getUser();

    const logged = !!data.user;

    $('login').classList.toggle('hidden',logged);

    $('panel').classList.toggle('hidden',!logged);

    if(logged){await load();await stats();}

  }

  $('signin').onclick = async () => {

    $('status').textContent='ログイン中…';

    const {error}=await db.auth.signInWithPassword({

      email:$('email').value.trim(),

      password:$('password').value

    });

    if(error){

      $('status').textContent=error.message;

      return;

    }

    $('status').textContent='';

    await show();

  };

  $('image').onchange = () => {

    const file=$('image').files[0];

    if(file)$('preview').src=URL.createObjectURL(file);

  };

  $('upload').onclick = async () => {

    const file=$('image').files[0];

    if(!file)return $('result').textContent='画像を選んでね';

    if(!['image/png','image/jpeg','image/webp'].includes(file.type))

      return $('result').textContent='JPG、PNG、WebPのみ対応';

    if(file.size>6*1024*1024)

      return $('result').textContent='6MB以内の画像を選んでね';

    $('upload').disabled=true;

    $('result').textContent='アップロード中…';

    const ext=file.type==='image/png'?'png':

      file.type==='image/jpeg'?'jpg':'webp';

    const name='schedule/'+crypto.randomUUID()+'.'+ext;

    const {error}=await db.storage.from('moca-images')

      .upload(name,file,{contentType:file.type});

    $('upload').disabled=false;

    if(error)return $('result').textContent=error.message;

    imageUrl=db.storage.from('moca-images')

      .getPublicUrl(name).data.publicUrl;

    $('result').textContent='アップロード完了！変更を保存してね♡';

  };

  $('save').onclick = async () => {

    const urls=['shop','wish','xlink'].map(id=>$(id).value.trim());

    if(urls.some(v=>v && !v.startsWith('https://')))

      return $('result').textContent='URLはhttps://から入力してね';

    $('save').disabled=true;

    const {data,error}=await db.from('moca_site').update({

      bio:$('bio').value,

      schedule_url:imageUrl,

      shop_url:urls[0],

      wish_url:urls[1],

      x_url:urls[2],

      updated_at:new Date().toISOString()

    }).eq('id',1).select('id');

    $('save').disabled=false;

    $('result').textContent=error?error.message:

      data?.length?'保存できたよ♡':'保存権限を確認してね';

  };

  $('refresh').onclick=stats;

  $('logout').onclick=async()=>{

    await db.auth.signOut();

    await show();

  };

  await show();

}

</script>

</body>

</html>
